[package]
name = "te002-tauri"
version = "0.1.0"
description = "TE-002 PoC: Tauri v2 + Three.js preview of the ZeroRodCAD engine via a Python sidecar"
edition = "2021"
publish = false

[lib]
name = "te002_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
