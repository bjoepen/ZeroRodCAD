[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zerorodcad-desktop"
version = "0.10.0"
description = "Parametric ZeroRod generator with CadQuery and PySide6"
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = {text = "MIT"}
authors = [
  {name = "ZeroRodCAD contributors"}
]
dependencies = [
  "cadquery>=2.5,<3",
]

[project.optional-dependencies]
desktop = [
  "PySide6>=6.7,<7",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
zerorodcad-build = "zerorodcad.cli:main"
zerorodcad-desktop = "zerorodcad_desktop.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
