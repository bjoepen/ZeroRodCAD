name: Engineering change request
description: Propose a measurable geometry or workflow change
title: "[ECR] "
labels: ["engineering-change"]
body:
  - type: textarea
    id: reason
    attributes:
      label: Reason
    validations:
      required: true
  - type: textarea
    id: values
    attributes:
      label: Old and new values
      placeholder: "body_depth: 8.0 mm -> 9.0 mm"
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation plan
    validations:
      required: true
